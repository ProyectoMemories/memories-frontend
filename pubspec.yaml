name: memories
description: "Memories: guarda momentos importantes con su contexto."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Versiones exactas: el equipo y el CI compilan con lo mismo.
dependencies:
  flutter:
    sdk: flutter
  # Cliente HTTP del cliente generado; la app lo usa para errores e interceptores.
  dio: 5.11.1
  flutter_riverpod: 3.4.3
  # Navegación con URLs reales: /verify-email y /reset-password (D79).
  # Trae material_ui y cupertino_ui (transitivas), fijadas solo en
  # pubspec.lock en 1.11.0 y 1.1.6 porque las últimas tenían menos de dos
  # semanas (D79). Revisa sus fechas antes de un `flutter pub upgrade`.
  go_router: 18.1.4
  # Tokens de sesión en Android (Keystore), D56 y D79. En web no se usa.
  # Trae jni y jni_flutter (transitivas), fijadas solo en pubspec.lock en 1.1.2
  # y 1.0.4+1 porque las últimas tenían menos de dos semanas (D79). Revisa sus
  # fechas antes de un `flutter pub upgrade`.
  flutter_secure_storage: 11.2.0
  # Cliente generado de la API (D79); se regenera con
  # packages/generate_memories_api.ps1.
  memories_api:
    path: packages/memories_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # Fuentes empaquetadas, sin descargarlas en tiempo de ejecución (D79).
  # Versiones fijas de cada peso: ver assets/fonts/README.md.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/fraunces/Fraunces-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/fraunces/Fraunces-Bold.ttf
          weight: 700
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/nunito_sans/NunitoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/nunito_sans/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito_sans/NunitoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/nunito_sans/NunitoSans-ExtraBold.ttf
          weight: 800
