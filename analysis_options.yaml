include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Reglas que el equipo si quiere cumplir siempre.
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - use_super_parameters

# Nota: el conjunto se puede endurecer (unawaited_futures,
# require_trailing_commas, prefer_const_constructors como warning) cuando el
# proyecto compile en las tres maquinas del equipo. Empezar con el CI en rojo
# por avisos de estilo solo consigue que se ignore el CI.
