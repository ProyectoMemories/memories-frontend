name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Formato, analisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Formato
        run: dart format --output=none --set-exit-if-changed .
      - name: Analisis estatico
        # Los avisos de estilo (infos) no tumban el pipeline; los errores y las
        # advertencias si. Ver la nota de analysis_options.yaml.
        run: flutter analyze --no-fatal-infos
      - name: Pruebas
        run: flutter test

  web:
    name: Compila para web
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        run: flutter build web --release --dart-define-from-file=env/prod.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: memories-web
          path: build/web
          retention-days: 7

  android:
    name: Compila para Android
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=env/prod.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: memories-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
